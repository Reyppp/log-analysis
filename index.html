  $('page').innerHTML=pageHeader('异常与关联','统计异常仅表示相对同类层偏离；相关关系不代表因果')+`<div class="grid">${chartPanel('anomaly-chart','异常指标',{controls:mc})}${chartPanel('correlation-chart','Spearman 相关',{controls:tc})}</div><h3 class="section-title">异常排名</h3>${table(a,['layer','material','method','metric','value','group','robust_z','level','reason'])}<h3 class="section-title">光学指标与工艺参数的 Spearman 相关</h3>${table(corr,['material','target','driver','spearman','samples'])}`;
  const drawA=key=>{viewState.anomalyMetric=key;if(!key)return $('anomaly-chart').innerHTML='<p class="muted">当前筛选未发现统计异常。</p>';plot('anomaly-chart',[...byMaterial(r,key),{x:a.filter(x=>x.metric===key).map(x=>x.layer),y:a.filter(x=>x.metric===key).map(x=>x.value),name:'统计异常',mode:'markers',marker:{color:'#b42318',size:12,symbol:'circle-open'}}],{title:`异常指标：${meta(key).label}`,yMetric:key})};
  const drawC=target=>{viewState.correlationTarget=target;const d=target?corr.filter(x=>x.target===target):corr;plot('correlation-chart',[{x:d.map(x=>x.abs_spearman),y:d.map(x=>`${meta(x.target).label} 对 ${meta(x.driver).label}`),text:d.map(x=>`${x.material} 材料 / ρ=${Number(x.spearman).toFixed(3)} / n=${x.samples}`),type:'bar',orientation:'h',marker:{color:COLORS[0]},hovertemplate:'%{y}<br>%{text}<extra></extra>'}],{title:'绝对值最高的 Spearman 相关',xTitle:'|Spearman ρ|',yTitle:'指标关系',hovermode:'closest',margin:{t:94,l:210,r:28,b:58}})};
  drawA(viewState.anomalyMetric);drawC(viewState.correlationTarget);
  if($('anomaly-metric'))$('anomaly-metric').onchange=e=>drawA(e.target.value);$('correlation-target').onchange=e=>drawC(e.target.value);
}
const RENDERERS={overview:renderOverview,theory:renderTheory,optical:renderOptical,device:renderDevice,anomaly:renderAnomaly};function renderActivePage(){if(!payload)return;clearError();if(viewState.focused)toggleChartFocus(viewState.focused.querySelector('.focus-chart'));document.querySelectorAll('#modules button').forEach(x=>x.classList.toggle('active',x.dataset.page===viewState.active));$('page').replaceChildren();RENDERERS[viewState.active](rows())}$('choose').onclick=choose;$('analyze').onclick=analyze;$('release-link').onclick=e=>{if(window.pywebview?.api){e.preventDefault();window.pywebview.api.open_releases()}};$('modules').onclick=e=>{const b=e.target.closest('[data-page]');if(b){viewState.active=b.dataset.page;renderActivePage()}};
let plotlyPromise;function loadPlotly(){if(window.Plotly)return Promise.resolve();if(plotlyPromise)return plotlyPromise;plotlyPromise=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='/plotly.min.js';s.onload=resolve;s.onerror=()=>reject(new ApiError('图表组件加载失败。'));document.head.appendChild(s)});return plotlyPromise}async function connect(){clearError();setService('checking','正在连接本地服务');try{const [h]=await Promise.all([api('/api/health'),loadPlotly()]);if(h.service!=='coating-analyzer')throw new ApiError('当前端口不是 Log Analysis 服务。','wrong_service','请重新启动应用。');$('app-version').textContent=`版本 ${h.app_version} · ${h.build_channel==='beta'?'测试版':h.build_channel}`;const s=await api('/api/state');$('path').value=s.path||'';$('analyze').disabled=!s.path;setService('online',s.path?'已恢复上次炉次路径':'本地服务已连接')}catch(e){showError(e)}}
const plotWithDefaultSpacing=plot;
plot=function(id,traces,options={}){const margin={t:94,l:72,r:28,b:58,...(options.margin||{})};const legend={orientation:'h',x:.025,y:1,yanchor:'bottom',font:{size:11},...(options.legend||{})};return plotWithDefaultSpacing(id,traces,{...options,margin,legend})};
if(location.protocol==='file:'){$('direct-file').classList.remove('hidden');$('app-shell').classList.add('hidden')}else connect();
