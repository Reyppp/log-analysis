<section id="direct-file" class="direct-file hidden"><div class="direct-card"><h1>需要先启动 Log Analysis</h1><p>当前页面是直接从 HTML 文件打开的，浏览器无法连接 Python 分析服务。</p><p>请关闭此页面，然后双击：</p><code class="launch-file">启动镀膜分析.bat</code></div></section>
<div id="app-shell"><header class="app-header"><div class="header-inner"><div class="brand"><span class="brand-mark">LA</span><div><h1>Log Analysis</h1><p>镀膜日志分析工作台</p></div></div><label class="path-field"><span>日志文件夹</span><input id="path" class="path" readonly placeholder="请选择日志文件夹"></label><div class="header-actions"><button id="choose" class="secondary">选择文件夹</button><button id="analyze" disabled>开始分析</button><details class="about"><summary>关于</summary><div class="about-panel"><strong>Log Analysis</strong><p id="app-version">正在读取版本…</p><p>单文件夹、本地只读分析。复核提示不代表质量判定。</p><a id="release-link" href="https://github.com/Reyppp/log-analysis/releases" target="_blank" rel="noreferrer">检查新版本</a></div></details></div><div id="service" class="service" data-state="checking"><span class="status-dot"></span><span id="status">正在连接本地服务</span></div></div></header>
<section id="source-switch" class="source-switch hidden" aria-label="日志分析范围"><strong>分析范围</strong><div id="scope-options" class="scope-options" role="tablist"></div><span id="source-note" class="source-note"></span></section>

<script>
const SESSION_TOKEN=new URLSearchParams(location.search).get('token')||'';const withToken=url=>{if(!SESSION_TOKEN)return url;const join=url.includes('?')?'&':'?';return `${url}${join}token=${encodeURIComponent(SESSION_TOKEN)}`};
const FIELD_META={layer:{label:'层号',digits:0},material:{label:'材料'},method:{label:'监控方式'},phy_thick:{label:'物理厚度',unit:'nm',digits:2},recipe_rate:{label:'理论速率',unit:'nm/s',digits:3},planned_time:{label:'理论时间',unit:'s',digits:1},start_t:{label:'理论 Start T',unit:'%',digits:2,percent:true},end_t:{label:'理论 End T',unit:'%',digits:2,percent:true},recipe_extreme:{label:'理论极值状态'},final_meas:{label:'终点 Meas',unit:'%',digits:2,percent:true},final_calc:{label:'终点动态 Calc',unit:'%',digits:2,percent:true},fit_end_residual:{label:'终点 Meas−动态 Calc',unit:'%',digits:2,percent:true},recipe_end_offset:{label:'Meas−理论 End T',unit:'%',digits:2,percent:true},fit_mae:{label:'全层 MAE',unit:'%',digits:2,percent:true},fit_rmse:{label:'全层 RMSE',unit:'%',digits:2,percent:true},fit_p95_abs:{label:'P95 绝对残差',unit:'%',digits:2,percent:true},fit_max_abs:{label:'最大绝对残差',unit:'%',digits:2,percent:true},actual_time:{label:'实际镀膜时间',unit:'s',digits:1},time_delta:{label:'实际−理论时间',unit:'s',digits:1},actual_rate:{label:'实际速率',unit:'nm/s',digits:3},rate_delta:{label:'实际−理论速率',unit:'nm/s',digits:3},actual_extreme:{label:'实际极值状态'},signal_median:{label:'信号中位数',unit:'%',digits:2,percent:true},signal_std:{label:'信号标准差',unit:'%',digits:2,percent:true},signal_cv:{label:'信号变异系数',unit:'%',digits:2,percent:true},optical_rows:{label:'光学采样数',digits:0},substrate_shutter_mismatch:{label:'基片挡板不一致次数',digits:0},material_shutter_mismatch:{label:'材料挡板不一致次数',digits:0},shutter_mismatch:{label:'挡板不一致次数',digits:0},layer_start:{label:'层开始时间'},layer_end:{label:'层结束时间'},machine_span:{label:'设备记录跨度',unit:'s',digits:1},machine_rows:{label:'设备采样数',digits:0},severity:{label:'级别'},scope:{label:'范围'},issue:{label:'问题'},detail:{label:'详情'},metric:{label:'指标'},value:{label:'数值',digits:4},change:{label:'相邻层变化',digits:4},group:{label:'分组基准'},baseline:{label:'分组中位数',digits:4},mad:{label:'MAD',digits:4},robust_z:{label:'稳健 Z 分数',digits:2},level:{label:'复核等级'},reason:{label:'异常依据'},source:{label:'数据源'},field:{label:'字段'},count:{label:'样本数',digit
